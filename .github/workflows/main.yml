name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar Gradle en el servidor
        uses: gradle/actions/setup-gradle@v3

      - name: Compilar APK (Búsqueda automática)
        run: |
          # Buscar donde esta el archivo build.gradle.kts y compilar desde alli
          BUILD_FILE=$(find . -name "build.gradle.kts" | head -n 1)
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Proyecto encontrado en: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Subir APK ejecutable como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ZoomEarthWallpaper-APK
          path: "**/build/outputs/apk/debug/*.apk"
