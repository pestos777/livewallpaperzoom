name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle en el sistema
        uses: gradle/actions/setup-gradle@v3

      - name: Asignar permisos a gradlew si existe
        run: |
          find . -name "gradlew" -exec chmod +x {} + || true

      - name: Compilar APK (Debug)
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          elif [ -f "./ZoomEarthWallpaper/gradlew" ]; then
            cd ZoomEarthWallpaper && ./gradlew assembleDebug --stacktrace
          elif [ -f "./ZoomEarthWallpaper/build.gradle.kts" ]; then
            cd ZoomEarthWallpaper && gradle assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Subir APK ejecutable como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ZoomEarthWallpaper-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            **/app/build/outputs/apk/debug/app-debug.apk
